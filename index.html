<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Office Rampage DX</title><style>body{margin:0;background:#182237;overflow:hidden;touch-action:none}canvas{width:100vw;height:100dvh;image-rendering:pixelated}button{touch-action:none;background:#283b58cc;color:white;border:2px solid #fff8;border-radius:14px;font:bold 25px system-ui;padding:15px}#controls{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between}#cover{position:fixed;inset:0;background:#182237ef;color:#ffe09c;display:grid;place-content:center;text-align:center;font:bold 25px system-ui}#go{background:#f5b94d;color:#192138}</style><canvas id="c"></canvas><div id="controls"><span><button data-k="l">◀</button><button data-k="r">▶</button></span><span><button data-k="j">⬆</button><button data-k="a">👊</button></span></div><div id="cover"><h1>OFFICE RAMPAGE DX</h1><p>PIXEL BRAWLER</p><button id="go">START GAME</button></div><script>(()=>{const c=document.querySelector('canvas'),g=c.getContext('2d'),cover=document.querySelector('#cover'),W=480,H=270,Y=215;let p,foes=[],keys={},score=0,floor=1,spawn=0,last=0,run=false,flash=0;function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio}onresize=resize;resize();function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x|0,y|0,w|0,h|0)}function actor(x,enemy){return{x,y:Y-44,v:0,vy:0,hp:enemy?50:100,face:enemy?-1:1,enemy,cd:0,hit:0,atk:0}}function punch(a,targets){if(a.cd)return;a.cd=a.enemy?.9:.3;a.atk=.17;for(let b of targets)if(Math.abs(b.x-a.x)<40&&Math.abs(b.y-a.y)<25&&(b.x-a.x)*a.face>-12){b.hp-=a.enemy?10:25;b.hit=.15;b.v=a.face*125;flash=.08;if(b.hp<=0&&b.enemy)score+=100;if(b.hp<=0&&!b.enemy){run=false;cover.style.display='grid';cover.querySelector('h1').textContent='GAME OVER';cover.querySelector('p').textContent='SCORE '+score;document.querySelector('#go').textContent='PLAY AGAIN'}}}function start(){p=actor(55,false);foes=[];score=0;floor=1;spawn=0;run=true;cover.style.display='none';last=performance.now();requestAnimationFrame(frame)}document.querySelector('#go').onclick=start;document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[k]=false});onkeydown=e=>{let k={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'j',ArrowUp:'j',KeyJ:'a'}[e.code];if(k){keys[k]=true;e.preventDefault()}};onkeyup=e=>{let k={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'j',ArrowUp:'j',KeyJ:'a'}[e.code];if(k)keys[k]=false};function sprite(a){let x=a.x,y=a.y,skin='#e4af87',suit=a.enemy?'#ae5970':'#468ca4',dark=a.enemy?'#4b3047':'#263953';g.save();g.translate(x,y);if(a.face<0){g.translate(24,0);g.scale(-1,1)}rect(5,32,7,11,dark);rect(15,32,7,11,dark);rect(4,40,9,4,'#171d2d');rect(14,40,9,4,'#171d2d');rect(3,16,20,19,a.hit?'#fff':suit);rect(10,17,6,15,'#e8d8b5');rect(12,19,2,9,'#c04e5a');rect(3,5,19,13,skin);rect(2,2,20,7,dark);rect(5,0,15,4,dark);rect(18,11,3,2,'#17243a');rect(1,20,5,11,skin);rect(20,20,a.atk?14:6,6,skin);rect(0,32,6,4,dark);g.restore()}function draw(){g.setTransform(c.width/W,0,0,c.height/H,0,0);g.imageSmoothingEnabled=false;rect(0,0,W,H,'#33465f');rect(0,0,W,24,'#1a2b40');for(let i=0;i<5;i++){let x=12+i*100;rect(x,30,83,112,'#243a52');rect(x+4,34,75,103,'#a6c6c8');for(let j=0;j<5;j++)rect(x+8+j*14,92-(j%3)*12,11,45+(j%3)*12,'#648397');rect(x+39,34,4,103,'#405c72')}rect(0,142,W,73,'#65768a');for(let i=0;i<12;i++)rect(i*42,145,2,70,'#8290a0');rect(0,Y,W,H-Y,'#353c4d');rect(0,Y,W,5,'#b2b5ae');for(let i=0;i<4;i++){let x=20+i*132;rect(x+5,175,75,5,'#976953');rect(x+10,180,5,35,'#583d43');rect(x+67,180,5,35,'#583d43');rect(x+20,145,43,30,'#273247');rect(x+23,148,37,24,'#75b5b1');rect(x+36,175,10,5,'#d6c4a0');rect(x+80,188,20,27,'#956c5b')}for(let a of foes){rect(a.x+1,Y-2,25,3,'#1e2635');sprite(a)}rect(p.x+1,Y-2,25,3,'#1e2635');sprite(p);rect(7,7,118,21,'#1a2235');rect(10,10,110,8,'#753e54');rect(10,10,110*Math.max(0,p.hp/100),8,'#79dfa7');g.fillStyle='#f9e2b4';g.font='bold 10px monospace';g.fillText('HP',10,25);g.fillText('FLOOR '+floor+'  SCORE '+score,155,17);if(flash>0)rect(0,0,W,H,'#ffffff18')}function frame(now){if(!run)return;let dt=Math.min(.033,(now-last)/1000);last=now;flash=Math.max(0,flash-dt);p.v=(keys.r?115:0)-(keys.l?115:0);if(p.v)p.face=Math.sign(p.v);if(keys.j&&p.y>=Y-44)p.vy=-240;if(keys.a)punch(p,foes);spawn-=dt;if(spawn<=0&&foes.length<Math.min(3+floor,7)){foes.push(actor(W+5,true));spawn=1.4}for(let a of [p,...foes]){a.cd=Math.max(0,a.cd-dt);a.hit=Math.max(0,a.hit-dt);a.atk=Math.max(0,a.atk-dt);if(a.enemy){let d=p.x-a.x;a.face=Math.sign(d)||-1;a.v=Math.abs(d)>28?Math.sign(d)*(43+floor*5):0;if(Math.abs(d)<33&&Math.abs(p.y-a.y)<25)punch(a,[p])}a.vy+=560*dt;a.x=Math.max(0,Math.min(W-25,a.x+a.v*dt));a.y+=a.vy*dt;if(a.y>Y-44){a.y=Y-44;a.vy=0}}foes=foes.filter(a=>a.hp>0);if(score>=floor*600){floor++;p.hp=Math.min(100,p.hp+20)}draw();if(run)requestAnimationFrame(frame)}draw()})();</script></html>
