ton class="attack" data-key="attack">HIT</button><button class="heavy" data-key="heavy">KICK</button><button data-key="dodge">DASH</button></div></div><div id="menu"><h1>OFFICE RAMPAGE</h1><p>FLOOR 01 — THE OPEN PLAN<br>Fight through the office. Smash the monitors. Defeat the floor manager.<br><small>Keyboard: WASD / arrows, J punch, K kick, L dash</small></p><button id="start">START FLOOR 01</button></div><script>(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d'),menu=document.querySelector('#menu'),start=document.querySelector('#start');const W=480,H=270,GROUND=212,LEVEL=1480;let state='menu',cam=0,t=0,last=0,shake=0,freeze=0,score=0,combo=0,comboT=0,stage=0,objects=[],enemies=[],particles=[],player,keys={},pressed={},message='',messageT=0;function R(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function line(x,y,w,h,color){R(x,y,w,h,color)}function rnd(a,b){return a+Math.random()*(b-a)}function particle(x,y,color,n=8,power=90){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-power,power),vy:rnd(-power,power),life:rnd(.18,.48),max:.48,color,size:rnd(1,4)})}function entity(x,y,type='guard'){return{x,y,z:0,vx:0,vz:0,hp:type==='boss'?240:type==='guard'?70:50,max:type==='boss'?240:type==='guard'?70:50,face:-1,type,hit:0,attack:0,attackTime:0,cd:0,stun:0,down:0,dead:false,anim:rnd(0,5),inv:0,combo:0}}function setup(){player=entity(65,205,'hero');player.hp=160;player.max=160;player.face=1;enemies=[entity(460,203,'guard'),entity(590,226,'intern'),entity(820,197,'guard'),entity(1030,220,'intern'),entity(1230,205,'boss')];objects=[{x:220,y:196,type:'monitor',hp:35},{x:375,y:190,type:'plant',hp:25},{x:710,y:213,type:'monitor',hp:35},{x:940,y:190,type:'plant',hp:25},{x:1115,y:212,type:'monitor',hp:35}];particles=[];cam=0;t=0;shake=0;freeze=0;score=0;combo=0;comboT=0;stage=0;message='CLEAR THE FLOOR';messageT=2.5;state='play';menu.style.display='none';last=performance.now();requestAnimationFrame(loop)}function end(win){state=win?'win':'lose';menu.style.display='grid';menu.querySelector('h1').textContent=win?'FLOOR CLEARED!':'YOU WERE FIRED';menu.querySelector('p').innerHTML='SCORE '+score+'<br>Enemies defeated: '+enemies.filter(e=>e.dead).length+' / '+enemies.length;start.textContent='PLAY AGAIN'}start.onclick=setup;const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',KeyJ:'attack',Space:'attack',KeyK:'heavy',KeyL:'dodge'};onkeydown=e=>{const k=keyMap[e.code];if(k){e.preventDefault();if(!keys[k])pressed[k]=true;keys[k]=true}};onkeyup=e=>{const k=keyMap[e.code];if(k){keys[k]=false;e.preventDefault()}};document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('pressed')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys[k]=false;b.classList.remove('pressed')})});function attack(a,heavy=false){if(a.cd>0||a.stun>0||a.down>0)return;a.attack=heavy?2:1;a.attackTime=heavy?.31:.19;a.cd=heavy?.65:.26;a.combo=heavy?0:(a.combo+1)%3;const reach=heavy?57:39,damage=heavy?36: a.combo===0?27:19;let hit=false;const targets=a===player?enemies:[player];for(const e of targets){if(e.dead||e.inv>0)continue;const dx=e.x-a.x;if(dx*a.face>-8&&dx*a.face<reach&&Math.abs(e.y-a.y)<26){hurt(e,damage,a.face,heavy);hit=true}}if(a===player){for(const o of objects){if(o.hp>0&&Math.abs(o.y-a.y)<36&&(o.x-a.x)*a.face>-12&&(o.x-a.x)*a.face<reach+15){o.hp-=damage;hit=true;particle(o.x,o.y-20,o.type==='monitor'?'#9ce9ff':'#8ed69c',12);if(o.hp<=0){score+=50;message='PROPERTY DAMAGE +50';messageT=.9}}}}if(hit){shake=heavy?7:4;freeze=heavy?.085:.045;if(a===player){combo++;comboT=2.2;score+=10*combo}}}function hurt(e,dmg,dir,heavy){if(e.inv>0||e.dead)return;e.hp-=dmg;e.hit=.22;e.stun=heavy?.43:.22;e.vx=dir*(heavy?160:85) c');return}g.save();g.translate(x,y);if(a.face<0)g.scale(-1,1);let walk=Math.sin(t*(hero?14:9)+a.anim)*((hero&&(keys.left||keys.right||keys.up||keys.down))||!hero?3:1),coat=hero?'#edf0df':boss?'#733f60':a.type==='intern'?'#718f9b':'#3b506b',pants=hero?'#243750':'#2a2d44',skin=hero?'#eab68e':boss?'#d7a27f':'#bd8c76';R(-9,-4,22,4,'#18283b66');R(-8,-14+walk,8,14,pants);R(5,-14-walk,8,14,pants);R(-10,-4+walk,12,5,'#1c2232');R(4,-4-walk,12,5,'#1c2232');R(-12,-39,28,27,a.hit>0?'#ffffff':coat);R(-9,-36,5,17,hero?'#b6c9d0':'#253a51');R(8,-36,5,17,hero?'#b6c9d0':'#253a51');R(-4,-38,8,18,hero?'#f8e3d1':'#c5a5a5');R(-1,-37,3,13,hero?'#d44e5e':'#ae444d');R(-11,-57,26,21,skin);R(-12,-58,27,9,hero?'#47382e':boss?'#55515b':'#2b2d37');R(-8,-61,21,6,hero?'#47382e':boss?'#55515b':'#2b2d37');R(9,-49,4,3,'#1c283a');R(14,-45,3,4,skin);R(-16,-37,7,18,skin);R(-17,-21,9,5,'#3a3242');let reach=a.attackTime>0?(a.attack===2?34:24):14;R(11,-36,reach,8,coat);R(11+reach,-36,8,8,skin);if(a.attackTime>0){R(11+reach+6,-38,7,12,'#ffdf83');R(11+reach+13,-33,6,3,'#ffffff')}if(boss){R(-14,-62,30,4,'#d1b17b');R(-14,-42,5,14,'#9d7c87')}g.restore();if(a!==player){R(x-17,y-69,35,4,'#291d33');R(x-17,y-69,35*Math.max(0,a.hp/a.max),4,boss?'#f0ae60':'#de6c7c')}}function background(){R(0,0,W,H,'#26354d');R(0,0,W,102,'#3a4b69');for(let i=0;i<12;i++){let x=i*72-(cam*.16%72);R(x,26,48,76,'#263d5c');R(x+7,14,19,88,'#425b7c');R(x+30,35,9,67,'#587390')}R(0,0,W,22,'#151f35');for(let i=0;i<8;i++){let x=i*86-(cam*.35%86);R(x,27,68,104,'#182d43');R(x+4,31,60,94,'#719ab1');R(x+8,58,16,65,'#4d7893');R(x+29,46,11,77,'#547c9a');R(x+44,69,15,54,'#405e80');R(x+32,31,3,94,'#c5c4b8')}R(0,132,W,62,'#4d6072');R(0,193,W,77,'#4c5264');R(0,193,W,5,'#acb1a9');for(let i=0;i<35;i++){let x=i*48-(cam%48);R(x,199,1,70,'#626a78');R(x,235,48,1,'#626a78')}for(let i=0;i<16;i++){let x=i*100-(cam%100);R(x+9,143,78,6,'#946b58');R(x+15,149,5,42,'#554350');R(x+77,149,5,42,'#554350');R(x+27,116,45,27,'#2a394d');R(x+31,120,37,19,'#85bdc4');R(x+44,143,10,5,'#b7c7bf');R(x+4,158,19,33,'#6d5360');R(x+6,160,15,3,'#a37b74')}R(0,254,W,16,'#303748')}function foreground(){for(let i=0;i<8;i++){let x=i*205+110-cam;if(x<-80||x>W+80)continue;R(x,170,9,45,'#343c51');R(x-15,166,39,7,'#b98c68');R(x-8,151,26,16,'#b7c3b6');R(x-4,154,18,11,'#59798d')}for(let o of objects){let x=o.x-cam;if(x<-60||x>W+60)continue;if(o.hp<=0){R(x-15,o.y-4,36,5,'#334054');R(x+7,o.y-9,8,6,'#75b8bf');continue}if(o.type==='monitor'){R(x-16,o.y-29,32,25,'#1c2b40');R(x-12,o.y-25,24,17,'#83c4c9');R(x-3,o.y-4,6,7,'#9a9eab');R(x-12,o.y+3,24,3,'#343b4b')}else{R(x-8,o.y-12,16,17,'#a9765d');R(x-5,o.y-34,10,22,'#47785c');R(x-19,o.y-33,14,8,'#559267');R(x+5,o.y-41,14,12,'#609e75');R(x-9,o.y-46,12,17,'#5f9b69')}}}function hud(){R(8,7,144,34,'#162337e6');R(13,12,25,24,'#a97c67');R(15,11,22,7,'#47382e');R(43,13,102,12,'#542e45');R(43,13,102*Math.max(0,player.hp/player.max),12,'#78dba5');R(43,28,102,4,'#d1b078');g.fillStyle='#fff2d4';g.font='bold 9px monospace';g.fillText('HP '+Math.ceil(player.hp)+' / '+player.max,45,23);R(W-127,7,120,26,'#162337e6');g.fillText('SCORE '+String(score).padStart(6,'0'),W-120,23);if(combo>1){g.font='bold 17px monospace';g.fillStyle='#f6c66e';g.fillText(combo+' HIT COMBO',W-155,53)}if(messageT>0){g.textAlign='center';g.font='bold 13px monospace';g.fillStyle='#ffe0a0';g.fillText(message,W/2,73);g.textAlign='left'}let boss=enemies.find(e=>e.type==='boss');if(boss&&!boss.dead&&Math.abs(boss.x-player.x)<290){R(145,246,190,11,'#29283b');R(147,248,186*boss.hp/boss.max,7,'#d36b77');g.font='bold 8px monospace';g.fillStyle='#fff';g.fillText('THE FLOOR MANAGER',184,243)}}function render(){g.setTransform(c.width/W,0,0,c.height/H,0,0);g.imageSmoothingEnabled=false;g.save();g.translate(Math.round(rnd(-shake,shake)),Math.round(rnd(-shake/2,shake/2)));background();g.save();g.translate(-Math.round(cam),0);const all=[...enemies.filter(e=>!e.dead),player].sort((a,b)=>a.y-b.y);for(const a of all)actor(a);for(const a of enemies.filter(e=>e.dead))actor(a);g.restore();foreground();for(const q of particles)R(q.x-cam,q.y,q.size,q.size,q.color);if(enemies.every(e=>e.dead)){R(LEVEL-80-cam,125,54,72,'#253b4e');R(LEVEL-76-cam,129,46,64,'#b1a5a0');R(LEVEL-55-cam,131,2,60,'#586b7a');R(LEVEL-72-cam,115,36,10,'#4fbc9b')}g.restore();hud()}function loop(now){if(state!=='play')return;let dt=Math.min(.033,(now-last)/1000);last=now;if(freeze>0){freeze-=dt;render();requestAnimationFrame(loop);return}update(dt);render();if(state==='play')requestAnimationFrame(loop)}function resize(){c.width=Math.round(innerWidth*devicePixelRatio);c.height=Math.round(innerHeight*devicePixelRatio);if(state!=='play'){g.setTransform(c.width/W,0,0,c.height/H,0,0);background()}}onresize=resize;resize()})();</script></body></html>
