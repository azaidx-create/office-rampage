<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Office Rampage</title><style>*{box-sizing:border-box}body{margin:0;background:#101523;color:white;font:16px system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}#start{position:absolute;inset:0;background:#101523ee;display:grid;place-content:center;text-align:center;gap:16px;z-index:4}button{border:0;border-radius:14px;background:#f4c44e;color:#111;font-weight:900;font-size:20px;padding:14px 22px}#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}#controls div{display:flex;gap:9px}.ctl{pointer-events:auto;min-width:58px;height:62px;padding:8px;background:#ffffff33;color:white;border:2px solid #ffffff55;touch-action:none;user-select:none}#hint{font-size:13px;color:#cbd5e1}</style></head><body><canvas id="c"></canvas><div id="start"><h1>🏢 OFFICE RAMPAGE</h1><p>Fight your way to the executive floor!</p><button id="go">START GAME</button><div id="hint">Landscape recommended · Touch controls</div></div><div id="controls"><div><button class="ctl" data-k="left">◀</button><button class="ctl" data-k="right">▶</button></div><div><button class="ctl" data-k="jump">⬆</button><button class="ctl" data-k="hit">👊</button></div></div><script>
(()=>{'use strict';const c=document.getElementById('c'),g=c.getContext('2d'),overlay=document.getElementById('start');let W=960,H=540,run=false,last=0,floor=1,score=0,player,enemies=[],particles=[],spawn=0,keys={};function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(c.width/W,0,0,c.height/H,0,0)}addEventListener('resize',resize);resize();const ground=H-95;function actor(x,enemy=false){return{x,y:ground-66,w:36,h:66,vx:0,vy:0,hp:enemy?40:100,max:enemy?40:100,face:enemy?-1:1,cd:0,flash:0,enemy,dead:false}}function reset(){floor=1;score=0;player=actor(100);enemies=[];particles=[];spawn=0;run=true;overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)}document.getElementById('go').addEventListener('click',reset);for(const b of document.querySelectorAll('[data-k]')){let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{keys[k]=false})}addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='Space'||e.code==='ArrowUp')keys.jump=true;if(e.code==='KeyJ'||e.code==='KeyK')keys.hit=true});addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(e.code==='Space'||e.code==='ArrowUp')keys.jump=false;if(e.code==='KeyJ'||e.code==='KeyK')keys.hit=false});function punch(a,target){if(a.cd>0)return;a.cd=a.enemy?0.9:0.28;for(const t of target){if(t.dead)continue;let dx=t.x-a.x;if(Math.abs(dx)<76&&Math.abs(t.y-a.y)<45&&dx*a.face>-30){t.hp-=a.enemy?9:22;t.flash=.16;t.vx+=a.face*230;if(t.hp<=0){t.dead=true;if(!t.enemy){end()}else score+=100}}}}function end(){run=false;overlay.style.display='grid';overlay.querySelector('h1').textContent='GAME OVER';overlay.querySelector('p').textContent='Score: '+score+' · Floor: '+floor;document.getElementById('go').textContent='PLAY AGAIN'}function update(dt){player.vx=(keys.right?230:0)-(keys.left?230:0);if(player.vx)player.face=Math.sign(player.vx);if(keys.jump&&player.y>=ground-player.h-.1)player.vy=-510;if(keys.hit)punch(player,enemies);spawn-=dt;if(spawn<=0&&enemies.filter(e=>!e.dead).length<Math.min(2+floor,7)){let e=actor(W+40,true);e.hp=e.max=35+floor*8;enemies.push(e);spawn=1.4}for(const a of [player,...enemies]){if(a.dead)continue;a.cd=Math.max(0,a.cd-dt);a.flash=Math.max(0,a.flash-dt);if(a.enemy){let d=player.x-a.x;a.face=Math.sign(d)||-1;a.vx=Math.abs(d)>48?Math.sign(d)*(75+floor*8):0;if(Math.abs(d)<62&&Math.abs(player.y-a.y)<40)punch(a,[player])}a.vy+=1200*dt;a.x=Math.max(0,Math.min(W-a.w,a.x+a.vx*dt));a.y+=a.vy*dt;if(a.y>ground-a.h){a.y=ground-a.h;a.vy=0}}enemies=enemies.filter(e=>!e.dead);if(score>=floor*600){floor++;player.hp=Math.min(100,player.hp+20)}}function draw(){g.fillStyle='#202d45';g.fillRect(0,0,W,H);for(let i=0;i<6;i++){let x=35+i*160;g.fillStyle='#49617a';g.fillRect(x,75,110,170);g.fillStyle='#9bd5e8';g.fillRect(x+7,83,96,150);g.fillStyle='#d4edf5';g.fillRect(x+51,83,5,150)}g.fillStyle='#35425a';g.fillRect(0,ground,W,H-ground);g.fillStyle='#66798c';g.fillRect(0,ground,W,8);for(let i=0;i<5;i++){let x=50+i*220;g.fillStyle='#8b674a';g.fillRect(x,ground-52,125,13);g.fillStyle='#604b3e';g.fillRect(x+12,ground-39,8,39);g.fillRect(x+107,ground-39,8,39);g.fillStyle='#b4c7d3';g.fillRect(x+38,ground-102,55,48)}for(const a of [...enemies,player]){if(a.dead)continue;g.save();g.translate(a.x,a.y);g.fillStyle=a.flash?'#fff':a.enemy?'#f07067':'#5dd1b1';g.fillRect(5,20,26,34);g.fillStyle='#eab68e';g.fillRect(8,0,22,23);g.fillStyle='#273349';g.fillRect(a.face>0?24:8,9,5,5);g.fillStyle='#253047';g.fillRect(6,54,10,12);g.fillRect(23,54,10,12);g.fillStyle=a.enemy?'#f5a0a0':'#f6e1b5';g.fillRect(a.face>0?30:-13,26,18,11);g.fillStyle='#111';g.fillRect(0,-12,36,5);g.fillStyle=a.enemy?'#e95050':'#54df75';g.fillRect(0,-12,36*Math.max(0,a.hp/a.max),5);g.restore()}g.fillStyle='#fff';g.font='bold 22px system-ui';g.fillText('FLOOR '+floor,25,35);g.fillText('SCORE '+score,25,65);g.fillStyle='#151c29';g.fillRect(W-235,24,205,22);g.fillStyle='#54df75';g.fillRect(W-232,27,199*Math.max(0,player.hp/100),16);g.strokeStyle='#fff';g.strokeRect(W-235,24,205,22)}function loop(now){if(!run)return;let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(run)requestAnimationFrame(loop)}draw()})();
</script></body></html>
